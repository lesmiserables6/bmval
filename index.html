<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Be My Valentine</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Times New Roman', serif;
            background: linear-gradient(135deg, #2c1338 0%, #734b6d 100%);
            color: #fff;
            text-align: center;
            padding: 20px;
            line-height: 1.6;
            overflow-x: hidden;
        }

        .container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(8px);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            width: 90%;
            max-width: 600px;
            position: relative;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.2);
            animation: fadeIn 1.5s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .main-image {
            width: 220px;
            height: 220px;
            object-fit: cover;
            border-radius: 15px;
            margin: 0 auto 25px;
            display: block;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
            border: 3px solid rgba(255, 255, 255, 0.2);
            transition: transform 0.3s ease;
        }

        .main-image:hover {
            transform: scale(1.02);
        }

        h1 {
            font-size: 2rem;
            margin-bottom: 2.5rem;
            color: #fff;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
            font-style: italic;
            line-height: 1.4;
        }

        .choices {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin: 2rem auto;
            max-width: 400px;
        }

        .choice-btn {
            padding: 15px 40px;
            font-size: 1.2rem;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50px;
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: lowercase;
            letter-spacing: 2px;
            backdrop-filter: blur(5px);
            min-width: 120px;
        }

        .choice-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        #result {
            margin-top: 2rem;
            font-size: 1.4rem;
            opacity: 0;
            transition: all 1s ease;
            color: #fff;
            padding: 0 20px;
            font-style: italic;
            position: relative;
            line-height: 1.6;
        }

        #image-container {
            margin-top: 2rem;
            max-width: 100%;
            height: 0;
            overflow: hidden;
            transition: height 0.5s ease;
        }

        #response-image {
            max-width: 100%;
            height: auto;
            border-radius: 15px;
            opacity: 0;
            transition: opacity 1s ease;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.2);
        }

        .floating-note {
            position: fixed;
            color: rgba(255, 255, 255, 0.3);
            font-size: 2rem;
            pointer-events: none;
            z-index: -1;
            animation: float 8s linear infinite;
        }

        @keyframes float {
            0% {
                transform: translateY(100vh) rotate(0deg);
                opacity: 0;
            }
            10% { opacity: 0.6; }
            90% { opacity: 0.6; }
            100% {
                transform: translateY(-100px) rotate(360deg);
                opacity: 0;
            }
        }

        .heart {
            position: absolute;
            pointer-events: none;
            opacity: 0;
            animation: heartFloat 4s ease-out forwards;
        }

        @keyframes heartFloat {
            0% {
                opacity: 0.8;
                transform: translate(0, 0) rotate(0deg);
            }
            100% {
                opacity: 0;
                transform: translate(var(--tx), -100px) rotate(var(--tr));
            }
        }

        #volume-control {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: rgba(255, 255, 255, 0.1);
            padding: 10px;
            border-radius: 50px;
            backdrop-filter: blur(5px);
            opacity: 0.7;
            transition: opacity 0.3s;
        }

        #volume-control:hover {
            opacity: 1;
        }

        #volume-slider {
            width: 100px;
            accent-color: #734b6d;
        }

        @media (max-width: 768px) {
            .container {
                padding: 20px;
            }

            h1 {
                font-size: 1.6rem;
            }

            .main-image {
                width: 180px;
                height: 180px;
            }

            .choices {
                flex-direction: column;
                align-items: center;
                gap: 15px;
            }

            .choice-btn {
                width: 80%;
                padding: 12px 30px;
            }

            #result {
                font-size: 1.2rem;
            }
        }

        @media (max-width: 480px) {
            .container {
                padding: 15px;
            }

            h1 {
                font-size: 1.4rem;
            }

            .main-image {
                width: 150px;
                height: 150px;
            }

            #volume-control {
                bottom: 10px;
                right: 10px;
            }

            #volume-slider {
                width: 80px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <img src="jeff.jpg" class="main-image">
        
        <h1>Lover, you should've come over cause it's not too late to be my valentine? 	(◕‿◕)♡</h1>
        
        <div class="choices">
            <button class="choice-btn" onclick="respond('yes')">yes</button>
            <button class="choice-btn" onclick="respond('no')">no</button>
        </div>

        <div id="result"></div>
        <div id="image-container">
            <img id="response-image" src="" alt="">
        </div>
    </div>

    <audio id="mainSong" loop>
        <source src="lysco1.mp3" type="audio/mpeg">
    </audio>
    <audio id="yesSong">
        <source src="lysco3.mp3" type="audio/mpeg">
    </audio>
    <audio id="noSong">
        <source src="lysco2.mp3" type="audio/mpeg">
    </audio>

    <div id="volume-control">
        <input type="range" id="volume-slider" min="0" max="1" step="0.1" value="0.5">
    </div>

    <script>
const mainSong = document.getElementById('mainSong');
const yesSong = document.getElementById('yesSong');
const noSong = document.getElementById('noSong');
const result = document.getElementById('result');
const responseImage = document.getElementById('response-image');
const imageContainer = document.getElementById('image-container');
const volumeSlider = document.getElementById('volume-slider');

[mainSong, yesSong, noSong].forEach(audio => {
    audio.volume = 0.5;
});

document.addEventListener('click', function startMusic() {
    mainSong.play();
    document.removeEventListener('click', startMusic);
}, { once: true });

volumeSlider.addEventListener('input', (e) => {
    [mainSong, yesSong, noSong].forEach(audio => {
        audio.volume = e.target.value;
    });
});

function createMusicNote() {
    const notes = ['♪', '♫', '♩', '♬'];
    const note = document.createElement('div');
    note.className = 'floating-note';
    note.textContent = notes[Math.floor(Math.random() * notes.length)];
    note.style.left = Math.random() * window.innerWidth + 'px';
    document.body.appendChild(note);
    
    setTimeout(() => note.remove(), 8000);
}

setInterval(createMusicNote, 3000);

function respond(answer) {
    const responses = {
        yes: {
            message: "Yayyy :D All my blood for the sweetness of your laughterrrr (つ≧▽≦)つ",
            image: "hehe.jpg",
            song: yesSong
        },
        no: {
            message: "(╯︵╰,) So I'll wait for you... and I'll burn",
            image: "rip.jpg",
            song: noSong
        }
    };

    // Stop all currently playing songs
    [mainSong, yesSong, noSong].forEach(audio => {
        audio.pause();
        audio.currentTime = 0;
    });

    // Play the appropriate response song
    responses[answer].song.volume = volumeSlider.value;
    responses[answer].song.play();

    result.style.opacity = '0';
    responseImage.style.opacity = '0';
    imageContainer.style.height = '0';

    if (answer === 'yes') {
        for (let i = 0; i < 12; i++) {
            setTimeout(() => {
                const heart = document.createElement('div');
                heart.className = 'heart';
                heart.textContent = '♥';
                heart.style.setProperty('--tx', (Math.random() * 200 - 100) + 'px');
                heart.style.setProperty('--tr', (Math.random() * 360) + 'deg');
                heart.style.fontSize = (Math.random() * 20 + 10) + 'px';
                heart.style.color = `rgba(255, ${Math.random() * 100 + 155}, ${Math.random() * 100 + 155}, 0.8)`;
                result.appendChild(heart);
                
                setTimeout(() => heart.remove(), 4000);
            }, i * 300);
        }
    }

    setTimeout(() => {
        result.textContent = responses[answer].message;
        responseImage.src = responses[answer].image;
        
        result.style.opacity = '1';
        responseImage.style.opacity = '1';
        imageContainer.style.height = 'auto';
    }, 1000);
}
    </script>
</body>
</html>
